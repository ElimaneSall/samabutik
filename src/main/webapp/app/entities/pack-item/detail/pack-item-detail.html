<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (packItem(); as packItemRef) {
      <div>
        <h2 data-cy="packItemDetailsHeading"><span jhiTranslate="samabutikApp.packItem.detail.title">Pack Item</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ packItemRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="samabutikApp.packItem.quantity">Quantity</span></dt>
          <dd>
            <span>{{ packItemRef.quantity }}</span>
          </dd>
          <dt><span jhiTranslate="samabutikApp.packItem.pack">Pack</span></dt>
          <dd>
            @if (packItem()!.pack) {
              <div>
                <a [routerLink]="['/pack', packItem()!.pack?.id, 'view']">{{ packItemRef.pack?.id }}</a>
              </div>
            }
          </dd>
          <dt><span jhiTranslate="samabutikApp.packItem.product">Product</span></dt>
          <dd>
            @if (packItem()!.product) {
              <div>
                <a [routerLink]="['/product', packItem()!.product?.id, 'view']">{{ packItemRef.product?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/pack-item', packItemRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
