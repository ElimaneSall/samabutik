<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (appSettings(); as appSettingsRef) {
      <div>
        <h2 data-cy="appSettingsDetailsHeading"><span jhiTranslate="samabutikApp.appSettings.detail.title">App Settings</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ appSettingsRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="samabutikApp.appSettings.paramKey">Param Key</span></dt>
          <dd>
            <span>{{ appSettingsRef.paramKey }}</span>
          </dd>
          <dt><span jhiTranslate="samabutikApp.appSettings.paramValue">Param Value</span></dt>
          <dd>
            <span>{{ appSettingsRef.paramValue }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/app-settings', appSettingsRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
